name: Scrape MTProto proxies

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        env:
          TARGET_CHANNEL: ${{ vars.TARGET_CHANNEL }}
        run: npm run scrape -w apps/scraper

      - name: Commit and push proxy list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/scraper/data/proxies.json
          if git diff --staged --quiet; then
            echo "No proxy changes to commit."
          else
            git commit -m "chore: update scraped MTProto proxies"
            git push
          fi
